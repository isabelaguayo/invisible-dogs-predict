# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - invisibledogs-predict

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch PetFinder primary photos from Git LFS
        working-directory: .
        run: |
          git lfs install --local
          git lfs pull --include="data/raw_petfinder/train_images/*-1.jpg" --exclude=""

      - name: Set up Node.js version
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Materialize PetFinder catalog photos
        run: node scripts/materialize-petfinder-catalog-photos.mjs

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test --if-present

      - name: Build
        run: npm run build

      - name: Prepare Azure deployment package
        run: node scripts/prepare-azure-package.mjs

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v7
        with:
          name: node-app
          path: frontend/deploy
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: node-app
          path: deploy-package

      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ADC47C55B6F34FD2BDCF570556CA749E }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5368C067BC9F459EA5B7477DEFD4B3AC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D8557E28F93B41518BEB66488C8D7D2C }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'invisibledogs-predict'
          slot-name: 'Production'
          package: deploy-package
