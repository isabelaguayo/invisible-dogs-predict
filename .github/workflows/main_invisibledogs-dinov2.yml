name: Build and deploy Python app to Azure Web App - invisibledogs-dinov2

on:
  push:
    branches:
      - main
    paths:
      - 'services/dinov2-inference/**'
      - '.github/workflows/main_invisibledogs-dinov2.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/dinov2-inference/requirements.txt

      - name: Install DINOv2 service dependencies
        working-directory: services/dinov2-inference
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Test DINOv2 inference service
        working-directory: services/dinov2-inference
        run: python -m pytest -q

      - name: Upload DINOv2 service artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: services/dinov2-inference/
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download DINOv2 service artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B095CD6131124B50B392E230F30911BF }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D4EDF50DF88841898098F64BF036F00B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_20068583495748C8B87DF9705D8ADD4D }}

      - name: Deploy DINOv2 service to Azure Web App
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'invisibledogs-dinov2'
          slot-name: 'Production'
          package: .
